name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-24.04
    env:
      # The shallow checkout has no tags, so git describe cannot find the version.
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Install shc
        run: sudo apt-get update && sudo apt-get install -y shc

      - name: Build static binary
        run: make build

      - name: Smoke test
        run: make test

      - name: Checksum
        run: make checksum

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
